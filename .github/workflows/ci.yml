name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

# Respect du quota GitHub : une seule exécution par branche,
# les runs en cours sont annulés dès qu'un nouveau push arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Secrets factices : le build ne touche jamais la base ni Auth.js
          AUTH_SECRET: ci-build-only-secret-not-real
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci-placeholder
